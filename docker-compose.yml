# docker-compose-taskmaster-all.yml
version: '3.8'
services:
  db:
    image: postgres:15
    container_name: taskboard_postgres
    env_file:
      - .env
    volumes:
      - taskboard_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
    
    networks:
      - taskmaster-network
  app:
    build: .
    env_file:
      - .env
    container_name: fastapi_app
    ports:
      - "8888:8000"
   
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskmaster-network
    restart: unless-stopped

volumes:
  taskboard_data:

networks:
  taskmaster-network:
    driver: bridge